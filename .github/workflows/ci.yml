name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        # Deliberately excludes sentence-transformers/pymupdf/google-generativeai
        # here: the synthetic pipeline test exercises the detection/matching/
        # report logic directly against the DOM layer and doesn't need them
        # (see tests/test_pipeline_synthetic.py's own docstring), which keeps
        # CI fast. A separate, slower job could add the full requirements.txt
        # and run against real sample PDFs if/when some are added to the repo.
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy python-docx reportlab python-dotenv

      - name: Syntax check every module
        run: python -m py_compile app.py modules/*.py tests/*.py

      - name: Run synthetic pipeline test
        run: python tests/test_pipeline_synthetic.py
